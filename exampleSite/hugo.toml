# Lumen 示例站点配置
# 复制本文件至你的站点根目录，修改 baseURL 即可开箱使用
baseURL = "https://example.com/"
title = "Lumen"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
enableRobotsTXT = true
paginate = 6
summaryLength = 60

# exampleSite 位于主题目录内，需向上两级定位主题
themesDir = "../.."
theme = "hugo-theme-lumen"

[markup]
  [markup.goldmark.renderer]
    unsafe = true          # 允许正文内嵌原始 HTML（如 <kbd> 标记）
  [markup.highlight]
    noClasses = false      # class 模式，由主题 CSS 适配明暗双主题
    lineNos = true         # 生成行号列，配合主题「行号开关」按钮
    guessSyntax = false
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[mediaTypes]
  [mediaTypes."application/javascript"]
    suffixes = ["js"]
  [mediaTypes."application/manifest+json"]
    suffixes = ["webmanifest"]

# 输出格式：首页额外生成 RSS / 搜索索引 / PWA 清单 / Service Worker
[outputs]
  home = ["HTML", "RSS", "searchindex", "manifest", "sw"]

[outputFormats.searchindex]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[outputFormats.manifest]
  mediaType = "application/manifest+json"
  baseName = "manifest"
  isPlainText = true
  notAlternative = true

[outputFormats.sw]
  mediaType = "application/javascript"
  baseName = "sw"
  isPlainText = true
  notAlternative = true

# 相关文章推荐权重
[related]
  threshold = 60
  toLower = true
  [[related.indices]]
    name = "keywords"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "categories"
    weight = 50

[params]
  description = "Lumen（流明）—— 现代极简、高性能、开箱即用的 Hugo 技术博客主题示例站点。"
  defaultTheme = "auto"        # auto / light / dark
  showToc = true
  showBreadcrumb = true
  showReadingTime = true
  showWordCount = true
  homeLayout = "card"          # list（经典列表）/ card（杂志卡片）
  readingSpeed = 400           # 中文阅读速度基准（字/分钟）
  enableSearch = true
  enablePWA = true
  enableComments = false       # 打开并填写 [params.giscus] 后生效

  [params.announcement]
    enabled = true
    text = "🎉 欢迎来到 Lumen 主题示例站 —— 试试右上角的主题切换与全文搜索"
    url = "/posts/lumen-theme-release/"
    dismissible = true

  [params.author]
    name = "Lumen 博主"
    avatar = "/avatar.png"

  [params.license]
    enabled = true
    name = "CC BY-NC-SA 4.0"
    url = "https://creativecommons.org/licenses/by-nc-sa/4.0/"
    text = "署名-非商业性使用-相同方式共享 4.0 国际许可协议"

  [[params.social]]
    name = "GitHub"
    url = "https://github.com/nova02640"
  [[params.social]]
    name = "Twitter"
    url = "https://twitter.com/nova02640"
  [[params.social]]
    name = "Email"
    url = "mailto:hi@example.com"
  [[params.social]]
    name = "RSS"
    url = "/index.xml"

  # Giscus 评论配置（enableComments = true 时启用）
  [params.giscus]
    repo = "nova02640/hugo-theme-lumen"
    repoId = ""
    category = "Announcements"
    categoryId = ""
    mapping = "pathname"
    reactions = "1"
    emitMetadata = "0"
    inputPosition = "top"

# 主导航
[menu]
[[menu.main]]
  name = "首页"
  pageRef = "/"
  weight = 1
[[menu.main]]
  name = "文章"
  pageRef = "/posts/"
  weight = 2
[[menu.main]]
  name = "分类"
  pageRef = "/categories/"
  weight = 3
[[menu.main]]
  name = "标签"
  pageRef = "/tags/"
  weight = 4
[[menu.main]]
  name = "归档"
  pageRef = "/archives/"
  weight = 5
[[menu.main]]
  name = "友链"
  pageRef = "/friends/"
  weight = 6
[[menu.main]]
  name = "关于"
  pageRef = "/about/"
  weight = 7
