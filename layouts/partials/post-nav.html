{{- /* 上一篇 / 下一篇 */ -}}
{{- if or .PrevInSection .NextInSection -}}
<nav class="post-nav" aria-label="{{ i18n "postNav" }}">
  {{- with .PrevInSection -}}
  <a class="post-nav-prev" href="{{ .RelPermalink }}">
    <span class="nav-label">← {{ i18n "prevPost" }}</span>
    <span class="nav-title">{{ .Title }}</span>
  </a>
  {{- end -}}
  {{- with .NextInSection -}}
  <a class="post-nav-next" href="{{ .RelPermalink }}">
    <span class="nav-label">{{ i18n "nextPost" }} →</span>
    <span class="nav-title">{{ .Title }}</span>
  </a>
  {{- end -}}
</nav>
{{- end -}}
